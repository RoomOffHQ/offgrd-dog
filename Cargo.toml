[workspace]
resolver = "2"
members = [
    "crates/offgrd-common",
    "crates/offgrd-core",
    "crates/offgrd-rules",
    "crates/offgrd-collectors",
    "crates/offgrd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/offgrd-dog/offgrd-dog"

[workspace.dependencies]
windows = "0.62"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "signal"] }
async-trait = "0.1"
